    <main>
            <div class="box" id="login">
                <h2><span>Cadastre-se</span></h2>
                <p style="text-align: center;">Cadastre-se para alguma coisa que eu não sei</p>
                <form id="cadastro">
                    <div>
                        <label for="name">Seu nome*</label>
                        <input type="name" id="nome" required placeholder="ex.: Thiago Wendt"/>
                    </div>
                    <div>
                        <label for="email">Seu e-mail*</label>
                        <input type="email" id="email" required placeholder="ex.: sausen@memail.com"/>
                    </div>
                    <div>
                        <label for="password">Sua senha*</label>
                        <input type="password" name="password" minlength="8" required onchange="confirmacao();" placeholder="ex.:abacaxi123"/>
                    </div>
                    <div>
                        <label for="password">Confirmar Senha*</label>
                        <input type="password" name="confirmpassword" minlength="8" required onchange="confirmacao();" placeholder="Insira a senha novamente" />
                    </div>
                    <div>
                        <label for="data">Data de nascimento*</label>
                        <input  type="date" id="nascimento" min="1945-04-01" max="2026-03-27" required/>
                    </div>
                    <div>
                        <button type="submit" class="enviar-button">Enviar</button>
                    </div>
                    <div>
                        <p>Já possui conta? <a href="login.html"><u style="color: #22D3EE;">Faça login</u></a></p>
                    </div>
               </form>
            </div>
        </div>
    </main>
